name: Python and Bash checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy statsmodels matplotlib
      - name: Check Bash syntax
        run: bash -n run.sh scripts/run_options.sh
      - name: Compile Python files
        run: python -m compileall -q scripts tests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

  geo-validation:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy statsmodels matplotlib
      - name: Validate the real GEO dataset (validation-only mode)
        run: ./run.sh
      - name: Upload validation outputs and logs (not the dataset)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gse165081-validation
          path: |
            logs/
            results/runs/
            data/processed/sample_sheet_clean.csv
          if-no-files-found: warn

  statistical-analysis:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy statsmodels matplotlib
      - name: Run exploratory age- and sex-adjusted analysis on GEO data
        run: ./run.sh -d adjusted
      - name: Upload statistical results, figures, logs, and run archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gse165081-adjusted-analysis
          path: |
            logs/
            results/runs/
          if-no-files-found: warn
